# Render Blueprint：連 GitHub 後可一鍵部署
# https://dashboard.render.com/blueprints
services:
  - type: web
    name: tx-risk-exposure
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: BREADTH_MAX_BACKFILL
        value: "40"
      - key: REVERSAL_LOOKBACK_DAYS
        value: "365"
      - key: FINMIND_TOKEN
        sync: false
